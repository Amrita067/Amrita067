<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="378" viewBox="0 0 880 378" role="img" aria-label="Amrita Bhagat profile card">
  <style>
    text { font-family: "JetBrains Mono", "Fira Code", Consolas, "Courier New", monospace; font-size: 15px; }
    .title { fill: #8b949e; font-size: 13px; }
    .name { fill: #8fd35a; font-size: 22px; font-weight: bold; }
    .label { fill: #8fd35a; }
    .val { fill: #e6edf3; }
    .sec { fill: #6c86b0; font-style: italic; }
    .prompt { fill: #8fd35a; }
    .cursor { fill: #8fd35a; animation: appear 0.01s 3.7s backwards, blink 1.1s steps(1) 3.7s infinite; }

    image { image-rendering: crisp-edges; image-rendering: pixelated; }
    .drop { animation: drop 0.7s cubic-bezier(.2,.8,.2,1) backwards; }
    .in   { animation: slide 0.5s ease-out backwards; }
    #typeclip rect { animation: type 1.2s steps(41) 2.5s backwards; }

    @keyframes drop  { from { opacity: 0; transform: translateY(-40px); } }
    @keyframes slide { from { opacity: 0; transform: translateY(-12px); } }
    @keyframes type  { from { width: 0; } }
    @keyframes appear { from { fill-opacity: 0; } }
    @keyframes blink { 50% { fill-opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      .drop, .in, .cursor, #typeclip rect { animation: none; }
    }
  </style>
  <defs>
    <clipPath id="typeclip"><rect x="60" y="340" width="520" height="28"/></clipPath>
  </defs>

  <g class="drop">
  <rect x="1" y="1" width="878" height="376" rx="12" fill="#0d1117" stroke="#3f5a85" stroke-width="2"/>
  <path d="M1 13a12 12 0 0 1 12-12h854a12 12 0 0 1 12 12v27H1z" fill="#161b22"/>
  <circle cx="26" cy="21" r="6" fill="#8fd35a"/>
  <circle cx="46" cy="21" r="6" fill="#6c86b0"/>
  <circle cx="66" cy="21" r="6" fill="#3f5a85"/>
  <text x="440" y="26" text-anchor="middle" class="title">amrita067 — zsh — 90x26</text>

  <g transform="translate(0,-26)">
    <g class="in" style="animation-delay:0.5s">
      <rect x="38" y="88" width="244" height="244" fill="none" stroke="#3f5a85" stroke-width="2"/>
      <image x="40" y="90" width="240" height="240" xlink:href="data:image/png;base64,"/>
    </g>

    <g class="in" style="animation-delay:0.8s">
      <text x="320" y="112" class="name">amrita bhagat</text>
      <line x1="320" y1="124" x2="840" y2="124" stroke="#30363d"/>
    </g>

    <g class="in" style="animation-delay:1.0s">
      <text x="320" y="150" class="label">Role</text>
      <text x="420" y="150" class="val">B.Tech CSE (AI &amp; ML) · 3rd year</text>
    </g>
    <g class="in" style="animation-delay:1.15s">
      <text x="320" y="172" class="label">Goal</text>
      <text x="420" y="172" class="val">GATE CS 2028 → M.Tech</text>
    </g>
    <g class="in" style="animation-delay:1.3s">
      <text x="320" y="194" class="label">Focus</text>
      <text x="420" y="194" class="val">ML · Deep Learning · LLMs · DSA</text>
    </g>

    <g class="in" style="animation-delay:1.5s"><text x="320" y="228" class="sec">~/learning</text></g>
    <g class="in" style="animation-delay:1.65s">
      <text x="320" y="250" class="label">Core</text>
      <text x="420" y="250" class="val">Python · DSA · Maths for ML</text>
    </g>
    <g class="in" style="animation-delay:1.8s">
      <text x="320" y="272" class="label">Next</text>
      <text x="420" y="272" class="val">PyTorch · Multimodal AI</text>
    </g>

    <g class="in" style="animation-delay:2.0s"><text x="320" y="306" class="sec">~/now</text></g>
    <g class="in" style="animation-delay:2.15s">
      <text x="320" y="328" class="label">Building</text>
      <text x="420" y="328" class="val">ML algorithms from scratch (NumPy)</text>
    </g>

    <g class="in" style="animation-delay:2.3s">
      <text x="320" y="350" class="label">Programs</text>
      <text x="420" y="350" class="val">Aspire Leaders · ISWDP</text>
    </g>

    <g class="in" style="animation-delay:2.4s">
      <text x="40" y="384" class="prompt">$</text>
    </g>
    <g clip-path="url(#typeclip)" transform="translate(0,26)">
      <text x="62" y="358" class="val">~ open to ml/ai internships &amp; collaboration<tspan class="cursor" dx="3">_</tspan></text>
    </g>
  </g>
  </g>
</svg>
